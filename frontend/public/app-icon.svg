<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4538" />
      <stop offset="100%" stop-color="#0c221c" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e8d4" />
      <stop offset="45%" stop-color="#d4b67b" />
      <stop offset="100%" stop-color="#b8945c" />
    </linearGradient>
    <clipPath id="arcL">
      <rect x="0" y="0" width="240" height="512" />
    </clipPath>
    <clipPath id="arcR">
      <rect x="272" y="0" width="240" height="512" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)" />
  <rect
    width="512"
    height="512"
    rx="114"
    fill="none"
    stroke="rgba(255, 248, 235, 0.12)"
    stroke-width="1.5"
  />

  <!-- Тонкая буква Ф: две дуги + вертикаль + перекладина -->
  <g
    fill="none"
    stroke="url(#line)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="256" cy="256" r="116" clip-path="url(#arcL)" />
    <circle cx="256" cy="256" r="116" clip-path="url(#arcR)" />
    <path d="M256 118 L256 394" />
    <path d="M168 256 L344 256" />
  </g>
</svg>
