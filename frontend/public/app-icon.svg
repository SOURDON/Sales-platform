<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Фон: один слой, богатый градиент (изумруд → тёмный с тёплым акцентом) -->
    <linearGradient id="bgSurface" x1="8%" y1="4%" x2="92%" y2="96%">
      <stop offset="0%" stop-color="#1f6b52" />
      <stop offset="28%" stop-color="#124536" />
      <stop offset="55%" stop-color="#0a221a" />
      <stop offset="82%" stop-color="#132920" />
      <stop offset="100%" stop-color="#0c1814" />
    </linearGradient>
    <radialGradient id="bgBloom" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="rgba(212, 182, 123, 0.22)" />
      <stop offset="45%" stop-color="rgba(20, 60, 48, 0.35)" />
      <stop offset="100%" stop-color="rgba(5, 14, 11, 0)" />
    </radialGradient>
    <!-- Буква: античное золото + холодный блик -->
    <linearGradient id="phiStroke" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f0e4c8" />
      <stop offset="35%" stop-color="#d4b67b" />
      <stop offset="70%" stop-color="#9a7440" />
      <stop offset="100%" stop-color="#5c4224" />
    </linearGradient>
    <linearGradient id="stemBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a86a" />
      <stop offset="50%" stop-color="#efe2c4" />
      <stop offset="100%" stop-color="#a8844a" />
    </linearGradient>
    <linearGradient id="stemEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.2)" />
    </linearGradient>
    <clipPath id="phiClipLeft">
      <rect x="0" y="0" width="228" height="512" />
    </clipPath>
    <clipPath id="phiClipRight">
      <rect x="284" y="0" width="228" height="512" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bgSurface)" />
  <rect width="512" height="512" rx="108" fill="url(#bgBloom)" />
  <rect
    width="512"
    height="512"
    rx="108"
    fill="none"
    stroke="rgba(212, 182, 123, 0.28)"
    stroke-width="3"
  />

  <!-- Кольцо «Ф»: только левая и правая дуга (стержень перекрывает центр) -->
  <g fill="none" stroke="url(#phiStroke)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="118" stroke-width="52" clip-path="url(#phiClipLeft)" />
    <circle cx="256" cy="256" r="118" stroke-width="52" clip-path="url(#phiClipRight)" />
  </g>

  <!-- Стержень Ф — широкий, читаемый -->
  <path
    fill="url(#stemBody)"
    d="M228,86 h56 a18,18 0 0 1 18,18 v304 a18,18 0 0 1 -18,18 h-56 a18,18 0 0 1 -18,-18 V104 a18,18 0 0 1 18,-18z"
  />
  <path
    fill="url(#stemEdge)"
    opacity="0.55"
    d="M232,92 h40 v328 h-40 z"
  />
</svg>
