# Сборка Windows NSIS для полностью офлайн аккаунта директора.
name: Desktop Windows Director Offline

on:
  push:
    tags:
      - 'director-v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DESKTOP_BUILD_PROFILE: director-offline

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Generate director icons
        shell: bash
        working-directory: desktop
        run: npm run icon:director

      - name: Prepare director-offline env
        shell: bash
        run: |
          VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.director.conf.json','utf8')).version")
          cp desktop/.env.director-offline desktop/.env
          echo "VITE_APP_VERSION=${VERSION}" >> desktop/.env

      - name: Build Tauri bundle
        shell: pwsh
        env:
          CI: 'true'
          DESKTOP_BUILD_PROFILE: director-offline
          DESKTOP_BUILD_SKIP_CONFIRM: '1'
          DESKTOP_BUILD_SKIP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/desktop-build.ps1"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-director-offline
          path: desktop/dist/*setup.exe
          if-no-files-found: error
