# Сборка macOS .dmg при теге desktop-v* (например desktop-v1.0.1).
# Артефакт: dmg из desktop/dist. Windows: desktop-windows.yml
name: Desktop macOS

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Generate icons
        working-directory: desktop
        run: npm run icon

      - name: Prepare desktop env (production API)
        run: |
          VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8')).version")
          {
            echo 'VITE_API_URL=http://77.233.223.48'
            echo "VITE_APP_VERSION=${VERSION}"
          } > desktop/.env

      - name: Smoke API
        run: bash scripts/desktop-smoke.sh http://77.233.223.48

      - name: Build Tauri bundle
        env:
          DESKTOP_BUILD_SKIP_CONFIRM: '1'
          DESKTOP_BUILD_SKIP_SMOKE: '1'
        run: |
          chmod +x scripts/desktop-build.sh
          bash scripts/desktop-build.sh

      - name: List bundle dir on failure
        if: failure()
        run: |
          find desktop/src-tauri/target -path '*/bundle/*' 2>/dev/null | head -50 || true
          ls -la desktop/dist 2>/dev/null || true

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: desktop-macos-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
