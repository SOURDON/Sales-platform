# Сборка macOS .dmg при теге desktop-v* (например desktop-v1.0.1).
# Артефакт: dmg из desktop/dist. Windows: desktop-windows.yml
name: Desktop macOS

on:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Generate macOS icons
        run: bash desktop/scripts/generate-icons.sh

      - name: Prepare desktop env (production API)
        run: |
          echo 'VITE_API_URL=https://sales-platform-1.onrender.com' > desktop/.env

      - name: Smoke API
        run: bash scripts/desktop-smoke.sh https://sales-platform-1.onrender.com

      - name: Build Tauri bundle
        env:
          DESKTOP_BUILD_SKIP_CONFIRM: '1'
          DESKTOP_BUILD_SKIP_SMOKE: '1'
        run: |
          chmod +x scripts/desktop-build.sh
          bash scripts/desktop-build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
