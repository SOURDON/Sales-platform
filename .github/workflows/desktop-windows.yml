# Сборка Windows NSIS installer при теге desktop-v* (например desktop-v1.0.1).
# Артефакт: *setup.exe из desktop/dist
name: Desktop Windows

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Generate icons
        shell: bash
        working-directory: desktop
        run: npm run icon

      - name: Prepare desktop env (production API)
        shell: bash
        run: |
          echo 'VITE_API_URL=https://sales-platform-1.onrender.com' > desktop/.env

      - name: Smoke API
        shell: bash
        run: bash scripts/desktop-smoke.sh https://sales-platform-1.onrender.com

      - name: Build Tauri bundle
        shell: pwsh
        env:
          CI: 'true'
          DESKTOP_BUILD_SKIP_CONFIRM: '1'
          DESKTOP_BUILD_SKIP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/desktop-build.ps1"

      - name: List bundle dir on failure
        if: failure()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/desktop/src-tauri/target/release/bundle"
          if (Test-Path $root) { Get-ChildItem -Path $root -Recurse | ForEach-Object { $_.FullName } }
          else { Write-Host "No bundle at $root" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-setup
          path: desktop/dist/*setup.exe
          if-no-files-found: error
