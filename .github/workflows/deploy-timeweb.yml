# Деплой на Timeweb по SSH после push в main (или вручную).
# Секрет TIMEWEB_SSH_KEY: приватный ключ ИЛИ base64 от него (см. setup-github-actions-deploy.sh).
name: Deploy Timeweb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/timeweb/**'
      - 'scripts/timeweb/**'
      - '.github/workflows/deploy-timeweb.yml'

concurrency:
  group: deploy-timeweb-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: TIMEWEB_SSH_KEY
    steps:
      - name: Validate and load deploy key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_RAW="$RUNNER_TEMP/key_raw"
          printf '%s' "${{ secrets.TIMEWEB_SSH_KEY }}" > "$KEY_RAW"
          if [ ! -s "$KEY_RAW" ]; then
            echo "::error::TIMEWEB_SSH_KEY пустой."
            echo "Добавьте секрет в Environment TIMEWEB_SSH_KEY → Environment secrets"
            echo "или в Settings → Secrets → Actions → Repository secrets"
            exit 1
          fi
          if grep -q 'BEGIN OPENSSH PRIVATE KEY' "$KEY_RAW"; then
            cp "$KEY_RAW" ~/.ssh/id_deploy
            echo "Ключ загружен как OpenSSH PEM"
          elif base64 -d "$KEY_RAW" > ~/.ssh/id_deploy 2>/dev/null && grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy; then
            echo "Ключ загружен из base64"
          else
            echo "::error::Неверный TIMEWEB_SSH_KEY. На Mac выполните:"
            echo "  base64 < scripts/timeweb/.deploy-keys/github_actions_ed25519 | tr -d '\\n' | pbcopy"
            echo "и вставьте одну строку в Repository secret."
            exit 1
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          echo "Deploy key fingerprint (ожидается SHA256:TVJgREAaFEUMoafUdMlu5FMmSlPfI2R4R6wnqLAXN08):"
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_deploy

      - name: Add server to known_hosts
        run: ssh-keyscan -H 77.233.223.48 >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes root@77.233.223.48 bash -s <<'REMOTE'
          set -euo pipefail
          bash /opt/sales-platform/scripts/timeweb/deploy-update.sh
          bash /opt/sales-platform/scripts/timeweb/ensure-demo-admins.sh
          curl -sf http://127.0.0.1/health
          echo " health OK"
          echo "deploy-stamp: $(curl -sf http://127.0.0.1/deploy-stamp.txt || echo unknown)"
          REMOTE

      - name: Verify public health
        run: |
          curl -sf --connect-timeout 15 http://77.233.223.48/health
          echo " public health OK"
          curl -sf --connect-timeout 15 http://77.233.223.48/deploy-stamp.txt
