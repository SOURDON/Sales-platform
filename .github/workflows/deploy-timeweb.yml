# Деплой на Timeweb по SSH после push в main (или вручную).
# Секрет: TIMEWEB_SSH_KEY — приватный ключ (Repository secrets, не Environment).
# Настройка: docs/GITHUB_ACTIONS_DEPLOY.md
name: Deploy Timeweb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/timeweb/**'
      - 'scripts/timeweb/**'
      - '.github/workflows/deploy-timeweb.yml'

concurrency:
  group: deploy-timeweb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate and load deploy key
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.TIMEWEB_SSH_KEY }}" > ~/.ssh/id_deploy
          if grep -q '^ssh-ed25519 ' ~/.ssh/id_deploy || grep -q '^ssh-rsa ' ~/.ssh/id_deploy; then
            echo "::error::В TIMEWEB_SSH_KEY попал публичный ключ (.pub). Нужен приватный: BEGIN OPENSSH PRIVATE KEY"
            exit 1
          fi
          if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy; then
            echo "::error::TIMEWEB_SSH_KEY должен содержать приватный OpenSSH ключ целиком"
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          echo "Deploy key fingerprint (должен совпасть с Mac):"
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_deploy

      - name: Add server to known_hosts
        run: ssh-keyscan -H 77.233.223.48 >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes root@77.233.223.48 bash -s <<'REMOTE'
          set -euo pipefail
          bash /opt/sales-platform/scripts/timeweb/deploy-update.sh
          bash /opt/sales-platform/scripts/timeweb/ensure-demo-admins.sh
          curl -sf http://127.0.0.1/health
          echo " health OK"
          echo "deploy-stamp: $(curl -sf http://127.0.0.1/deploy-stamp.txt || echo unknown)"
          REMOTE

      - name: Verify public health
        run: |
          curl -sf --connect-timeout 15 http://77.233.223.48/health
          echo " public health OK"
          curl -sf --connect-timeout 15 http://77.233.223.48/deploy-stamp.txt
