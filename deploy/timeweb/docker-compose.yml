# Timeweb: PostgreSQL + API + сайт (React) + Caddy HTTPS.
# cp env.example .env && nano .env  →  bash scripts/timeweb/enable-site-ru.sh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=768}
      SALES_MEMORY_DAYS: ${SALES_MEMORY_DAYS:-1825}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node dist/src/main.js

  caddy:
    build:
      context: ../..
      dockerfile: deploy/timeweb/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file: .env
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
